<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0A1C">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>30 שנה: המבחן</title>
<style>
/* ==========================================================================
   פונטים — עובדים אופליין מתוך תיקיית fonts/.
   אם הקבצים חסרים, יש נפילה חיננית לפונטים עבריים של המערכת.
   הרץ פעם אחת: bash fetch-fonts.sh   (דורש אינטרנט, פעם אחת בלבד)
   ========================================================================== */
@font-face{font-family:'Suez One';src:url('fonts/SuezOne-Regular.ttf') format('truetype'), url('fonts/SuezOne-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Heebo';src:url('fonts/Heebo-Light.ttf') format('truetype'), url('fonts/Heebo-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Heebo';src:url('fonts/Heebo-Medium.ttf') format('truetype'), url('fonts/Heebo-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Heebo';src:url('fonts/Heebo-ExtraBold.ttf') format('truetype'), url('fonts/Heebo-ExtraBold.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Frank Ruhl Libre';src:url('fonts/FrankRuhlLibre-Regular.ttf') format('truetype'), url('fonts/FrankRuhlLibre-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Frank Ruhl Libre';src:url('fonts/FrankRuhlLibre-Bold.ttf') format('truetype'), url('fonts/FrankRuhlLibre-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

:root{
  --ink:        #14122E;
  --ink-deep:   #0B0A1C;
  --paper:      #F4E9D8;
  --paper-warm: #E8D5B7;
  --magenta:    #FF2E7E;
  --tangerine:  #FF8A1F;
  --electric:   #00E5C7;
  --gold:       #FFC93C;
  --violet:     #7B4BFF;
  --line:       rgba(244,233,216,.16);
  --muted:      rgba(244,233,216,.52);

  --display: 'Suez One', 'Arial Hebrew', 'Narkisim', 'David', serif;
  --body: 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
  --letter: 'Frank Ruhl Libre', 'Times New Roman', serif;
  --ease: cubic-bezier(.16,1,.3,1);
  --pad: clamp(14px, 2.2vw, 34px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;background:var(--ink-deep);overscroll-behavior:none}
body{
  font-family:var(--body);color:var(--paper);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  font-size:clamp(15px,1.5vw,20px);
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(123,75,255,.30), transparent 55%),
    radial-gradient(100% 80% at 5% 110%, rgba(255,46,126,.22), transparent 60%),
    var(--ink);
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
img{display:block;max-width:100%}

/* ---------- שכבות אווירה ---------- */
.grain{position:fixed;inset:-40px;pointer-events:none;z-index:60;opacity:.06}
.grain svg{width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:55;
  background:radial-gradient(120% 100% at 50% 45%, transparent 45%, rgba(0,0,0,.62) 100%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:56;opacity:.16;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.055) 0 1px, transparent 1px 4px)}

/* נורות אולפן רודפות בקצה העליון */
.bulbs{position:fixed;top:0;right:0;left:0;height:10px;z-index:50;display:flex;gap:10px;padding:0 12px;pointer-events:none;opacity:.85}
.bulbs i{flex:1;height:5px;border-radius:0 0 6px 6px;background:var(--gold);opacity:.18;
  animation:chase 2.6s linear infinite;box-shadow:0 0 12px var(--gold)}
@keyframes chase{0%,88%{opacity:.14}92%{opacity:1}100%{opacity:.14}}

.onair{position:fixed;top:16px;left:16px;z-index:52;display:flex;align-items:center;gap:9px;
  padding:7px 15px 8px;border:2px solid var(--magenta);border-radius:3px;
  font-weight:800;letter-spacing:.06em;font-size:clamp(11px,1.15vw,15px);
  color:var(--magenta);background:rgba(255,46,126,.08);
  text-shadow:0 0 14px rgba(255,46,126,.7);box-shadow:0 0 26px rgba(255,46,126,.22), inset 0 0 18px rgba(255,46,126,.12)}
.onair::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--magenta);
  box-shadow:0 0 12px var(--magenta);animation:blink 1.8s steps(1,end) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}

/* ---------- מסכים ---------- */
#app{position:fixed;inset:0;z-index:10}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--pad);padding-top:calc(var(--pad) + 14px)}

/* ---------- נייר ---------- */
.paper{
  position:relative;background:
    radial-gradient(130% 90% at 18% 0%, #FFF7E9 0%, var(--paper) 48%, var(--paper-warm) 100%);
  color:var(--ink);border-radius:2px;
  box-shadow:0 34px 70px -24px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.35) inset,
             0 0 90px rgba(160,120,70,.12) inset;
}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(115deg, rgba(150,110,60,.05) 0 2px, transparent 2px 7px)}
.tape{position:absolute;width:120px;height:34px;background:rgba(255,242,214,.42);
  border-left:1px dashed rgba(255,255,255,.35);border-right:1px dashed rgba(255,255,255,.35);
  box-shadow:0 3px 10px rgba(0,0,0,.35);backdrop-filter:blur(1px)}
.tape.tr{top:-15px;right:26px;transform:rotate(6deg)}
.tape.tl{top:-15px;left:26px;transform:rotate(-7deg)}
.tape.br{bottom:-15px;right:52px;transform:rotate(-4deg)}
.tape.bl{bottom:-15px;left:52px;transform:rotate(5deg)}

/* ---------- מסך פתיחה ---------- */
.intro{align-items:center;justify-content:center;text-align:center}
.intro-card{padding:clamp(20px,3.4vh,44px) clamp(30px,6vw,90px);max-width:min(1000px,92vw);
  transform:rotate(-1.2deg);animation:cardIn .8s var(--ease) both}
.big30{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-size:clamp(7rem,26vh,16rem);line-height:.82;color:var(--ink);
  letter-spacing:-.02em;margin:0;position:relative}
.big30 span{display:inline-block;animation:pop .9s var(--ease) both}
.big30 span:nth-child(2){animation-delay:.12s}
.intro-sub{font-family:var(--display);font-size:clamp(1.2rem,3.4vh,2.3rem);margin:.35em 0 .1em;color:var(--ink)}
.intro-meta{font-family:var(--letter);font-style:italic;font-size:clamp(.95rem,2.2vh,1.4rem);
  color:#6B5B44;letter-spacing:.02em}
.intro-rule{height:3px;width:min(420px,70%);margin:clamp(12px,2.2vh,22px) auto;
  background:linear-gradient(to left, transparent, var(--magenta), var(--tangerine), transparent)}
.kick-title{font-family:var(--display);color:var(--magenta);font-size:clamp(1rem,2.4vh,1.5rem);
  letter-spacing:.16em;margin-bottom:.6em}

/* ---------- כותרת עליונה של שאלה ---------- */
.qhead{display:flex;align-items:center;gap:16px;flex:0 0 auto;min-height:44px}
.act{font-weight:800;font-size:clamp(11px,1.2vw,15px);letter-spacing:.14em;color:var(--gold);
  border:1px solid rgba(255,201,60,.4);padding:6px 12px;border-radius:2px;white-space:nowrap}
.dots{display:flex;gap:7px;flex:1;justify-content:center;align-items:center}
.dots i{position:relative;width:9px;height:9px;border-radius:50%;background:rgba(244,233,216,.22);transition:all .4s var(--ease)}
.dots i::after{content:'';position:absolute;inset:-15px -3px}
.dots i.done{background:rgba(244,233,216,.5)}
.dots i.now{background:var(--electric);width:30px;border-radius:5px;box-shadow:0 0 16px var(--electric)}

/* ---------- גוף השאלה ---------- */
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;min-height:0;padding:0 clamp(10px,4vw,70px)}
.qnum{direction:ltr;unicode-bidi:isolate;position:absolute;bottom:-6%;left:-2%;font-family:var(--display);
  font-size:clamp(6rem,26vw,22rem);line-height:.7;color:var(--paper);opacity:.055;pointer-events:none;z-index:0}
.qbody > *{position:relative;z-index:1}
.qbody > .qnum{position:absolute;z-index:0}
.kicker{font-weight:800;letter-spacing:.2em;font-size:clamp(12px,1.4vw,17px);color:var(--electric);
  margin-bottom:clamp(10px,2vh,22px);animation:up .5s var(--ease) both}
.qtitle{font-family:var(--display);font-size:clamp(1.9rem,5vw,4.3rem);line-height:1.16;margin:0;
  color:var(--paper);text-wrap:balance;max-width:22ch}
.qtitle .w{display:inline-block;animation:up .6s var(--ease) both}
.qsub{margin-top:clamp(12px,2.4vh,26px);font-weight:300;font-size:clamp(1rem,1.9vw,1.5rem);
  color:rgba(244,233,216,.66);max-width:40ch;animation:up .6s var(--ease) both;animation-delay:.35s}
.hostnote{margin-top:clamp(10px,1.8vh,18px);font-family:var(--letter);font-style:italic;
  color:var(--gold);font-size:clamp(.9rem,1.6vw,1.2rem);opacity:.9;
  border-top:1px dashed rgba(255,201,60,.35);padding-top:10px;max-width:38ch}

/* ---------- כפתורים ---------- */
.footbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding-top:clamp(8px,1.6vh,18px)}
.cta{min-height:74px;padding:0 clamp(28px,4.5vw,64px);border-radius:3px;
  font-family:var(--display);font-size:clamp(1.15rem,2.5vw,2rem);color:#fff;
  background:linear-gradient(160deg,var(--magenta),#D3125F);
  box-shadow:0 12px 0 -2px #8E0A3F, 0 26px 44px -14px rgba(255,46,126,.6);
  transform:translateY(0);transition:transform .12s ease, box-shadow .12s ease;
  animation:up .6s var(--ease) both;animation-delay:.5s}
.cta:active{transform:translateY(6px);box-shadow:0 6px 0 -2px #8E0A3F, 0 12px 26px -12px rgba(255,46,126,.6)}
.cta.teal{background:linear-gradient(160deg,var(--electric),#00A891);color:#04201C;
  box-shadow:0 12px 0 -2px #007A69, 0 26px 44px -14px rgba(0,229,199,.5)}
.cta.teal:active{box-shadow:0 6px 0 -2px #007A69}
.cta.gold{background:linear-gradient(160deg,var(--gold),#E09A00);color:#2A1C00;
  box-shadow:0 12px 0 -2px #9E6C00, 0 26px 44px -14px rgba(255,201,60,.5)}
.cta.gold:active{box-shadow:0 6px 0 -2px #9E6C00}
.ghost{min-height:64px;min-width:64px;padding:0 22px;border:2px solid rgba(244,233,216,.28);
  border-radius:3px;font-weight:500;font-size:clamp(.95rem,1.5vw,1.15rem);color:rgba(244,233,216,.8);
  background:rgba(244,233,216,.04)}
.ghost:active{background:rgba(244,233,216,.14)}
.ghost.tiny{min-height:56px;padding:0 16px;font-size:.95rem}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:72px;height:104px;z-index:30;
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:rgba(244,233,216,.3);
  background:linear-gradient(to left, rgba(11,10,28,.5), transparent)}
.arrow:active{color:var(--electric)}
.arrow.prev{right:0}
.arrow.next{left:0;background:linear-gradient(to right, rgba(11,10,28,.5), transparent)}

/* ---------- חשיפה: כרטיסים כפולים ---------- */
.reveal-title{width:100%;font-family:var(--display);font-size:clamp(1.2rem,2.9vw,2.3rem);color:var(--gold);
  text-align:center;margin:0 0 clamp(10px,2vh,22px);animation:up .5s var(--ease) both}
.cards{display:flex;gap:clamp(14px,2.6vw,38px);align-items:stretch;justify-content:center;
  width:100%;max-width:1250px;margin:0 auto;min-height:0;flex:1}
.card{flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:clamp(16px,3vh,34px) clamp(16px,2.4vw,34px);
  opacity:0;transform:translateX(-70px) rotate(-3deg)}
.card.in{animation:cardIn .7s var(--ease) forwards}
.card.mom{transform:translateX(70px) rotate(3deg)}
.card-who{font-family:var(--display);font-size:clamp(1.3rem,3vw,2.4rem);margin:0 0 .35em;
  display:flex;align-items:center;gap:12px}
.card-who::before{content:"";width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.card.dad .card-who{color:#C4590A}
.card.dad .card-who::before{background:var(--tangerine);box-shadow:0 0 0 4px rgba(255,138,31,.25)}
.card.mom .card-who{color:#B3125A}
.card.mom .card-who::before{background:var(--magenta);box-shadow:0 0 0 4px rgba(255,46,126,.25)}
.card-text{font-family:var(--letter);font-style:italic;font-size:clamp(1.05rem,2.1vw,1.75rem);
  line-height:1.5;color:#241F16;overflow:auto;flex:1;display:flex;align-items:center}
.card-text::before{content:"„";font-size:2em;line-height:0;color:rgba(36,31,22,.25);margin-left:.1em;align-self:flex-start;margin-top:.45em}
.card.dad{transform-origin:bottom right}
.card.mom{transform-origin:bottom left}
.single-card{width:100%;max-width:min(1000px,92vw);margin:0 auto;padding:clamp(22px,4vh,48px) clamp(24px,4vw,60px);
  text-align:center;opacity:0;animation:cardIn .7s var(--ease) .1s forwards}
.single-card .card-text{display:block;text-align:center}
.single-card .card-text::before{content:none}

/* ---------- פולרואיד ---------- */
.polaroid{background:#FCF7EE;padding:14px 14px 0;border-radius:2px;
  box-shadow:0 34px 60px -22px rgba(0,0,0,.85);transform:rotate(-2deg);
  display:flex;flex-direction:column;max-height:100%;opacity:0;animation:cardIn .8s var(--ease) forwards}
.polaroid img{width:100%;height:auto;object-fit:cover;min-height:0;flex:1;background:#DED2BC}
.polaroid .cap{font-family:var(--letter);font-style:italic;color:#3A3226;
  font-size:clamp(1rem,1.9vw,1.5rem);padding:.6em .2em .75em;text-align:center;flex:0 0 auto}
/* קיר תמונות — כמה פולרואידים זה לצד זה */
.wall{width:100%;flex:1;display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,2.2vw,34px);min-height:0;padding:4px clamp(4px,1.4vw,18px) 10px}
.wall .polaroid{flex:1 1 0;min-width:0;max-width:min(46vw,600px);max-height:100%;opacity:0;transform:translateY(30px)}
.wall .polaroid.in{animation:wallIn .75s var(--ease) forwards}
.wall .polaroid:nth-child(odd).in{animation-name:wallInL}
.wall .polaroid img,.wall .missing{aspect-ratio:4/3;width:100%;height:auto;flex:0 0 auto;
  object-fit:cover;object-position:center 30%}
.wall .cap{font-size:clamp(.85rem,1.5vw,1.2rem)}
@keyframes wallIn{to{opacity:1;transform:translateY(0) rotate(2deg)}}
@keyframes wallInL{to{opacity:1;transform:translateY(0) rotate(-2.4deg)}}
.settled .wall .polaroid{opacity:1 !important}

/* תמונה לצד גרף ההצבעה */
.bars-wrap{flex:1;display:flex;align-items:center;gap:clamp(12px,2.4vw,32px);min-height:0}
.bars-photo{flex:0 0 auto;width:clamp(140px,21vw,290px);max-height:100%}
.bars-photo .polaroid{width:100%}
.bars-photo img,.bars-photo .missing{aspect-ratio:4/3;object-fit:cover}

.photo-wrap{width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 0 12px}
.photo-wrap .polaroid{width:auto;max-width:min(78vw,900px);max-height:100%}
.photo-wrap .polaroid img{flex:0 1 auto;width:auto;height:auto;max-width:100%;max-height:56dvh;object-fit:contain}
.photo-wrap .missing{width:min(60vw,620px)}
.photo-wrap .polaroid{max-width:min(78vw,900px)}
.missing{width:100%;aspect-ratio:4/3;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:repeating-linear-gradient(45deg,#E4D8C2 0 14px,#DCCFB6 14px 28px);color:#6B5B44;
  font-weight:500;text-align:center;padding:16px;font-size:clamp(.85rem,1.4vw,1.05rem)}

/* ---------- טיימר ---------- */
.timer-stage{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,24px);min-height:0}
.timer-row{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,60px);width:100%;min-height:0;flex:1}
.ring{position:relative;width:clamp(180px,30vh,320px);height:clamp(180px,30vh,320px);flex:0 0 auto;
  border-radius:50%;box-shadow:0 0 70px -12px rgba(0,229,199,.55);transition:box-shadow .3s}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:rgba(244,233,216,.13)}
.ring .fg{stroke:var(--electric);transition:stroke .3s}
.ring.warn .fg{stroke:var(--magenta)}
.ring.warn{box-shadow:0 0 80px -8px rgba(255,46,126,.7)}
.ring .num{direction:ltr;unicode-bidi:isolate;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(3.4rem,9vh,6.5rem);color:var(--paper)}
.timer-label{font-family:var(--display);font-size:clamp(1.2rem,3vw,2.2rem);color:var(--gold);text-align:center}
.ring-col{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);flex:0 0 auto}
.timer-photo{flex:1 1 auto;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center}
.timer-photo .polaroid{width:auto;max-height:100%;max-width:min(52vw,760px)}
.timer-photo .polaroid img{flex:0 1 auto;width:auto;height:auto;max-width:100%;max-height:52dvh;object-fit:contain}
.timer-photo .missing{width:min(46vw,600px)}
.shake{animation:shake .5s}
.done-badge{font-family:var(--display);color:var(--magenta);font-size:clamp(1.6rem,4vw,3rem);
  animation:pop .5s var(--ease) both;text-shadow:0 0 30px rgba(255,46,126,.6)}

/* ---------- מכונת מזל ---------- */
.slot-box{max-width:min(92vw,900px);margin:0 auto;padding:clamp(20px,4vh,44px) clamp(30px,6vw,80px);min-width:min(80vw,620px);
  text-align:center;overflow:hidden;position:relative}
.slot-box::before,.slot-box::after{content:"";position:absolute;right:0;left:0;height:34%;pointer-events:none;z-index:2}
.slot-box::before{top:0;background:linear-gradient(to bottom,#FFF7E9,transparent)}
.slot-box::after{bottom:0;background:linear-gradient(to top,var(--paper-warm),transparent)}
.slot-val{font-family:var(--display);font-size:clamp(3rem,11vw,8rem);line-height:1.05;color:var(--ink);
  display:block;position:relative;z-index:1}
.slot-val.landed{color:#B3125A;animation:pop .6s var(--ease) both}
.slot-cap{font-family:var(--letter);font-style:italic;color:#6B5B44;font-size:clamp(1rem,1.9vw,1.4rem);position:relative;z-index:3}

/* ---------- הצבעה ---------- */
.vote-stage{width:100%;flex:1;display:flex;flex-direction:column;min-height:0;gap:clamp(8px,1.6vh,18px)}
.vote-prompt{font-family:var(--display);text-align:center;font-size:clamp(1.4rem,3.6vw,2.9rem);color:var(--paper)}
.vote-hint{text-align:center;color:rgba(244,233,216,.55);font-weight:300;font-size:clamp(.9rem,1.5vw,1.15rem)}
.vote-count{text-align:center;font-weight:800;color:var(--electric);font-size:clamp(1rem,1.8vw,1.35rem);
  letter-spacing:.01em}
.vote-count.full{color:var(--gold)}
.vote-meter{display:flex;gap:clamp(6px,1vw,12px);justify-content:center;align-items:center}
.vote-meter i{width:clamp(13px,1.7vw,21px);height:clamp(13px,1.7vw,21px);border-radius:50%;
  border:2px solid rgba(244,233,216,.28);transition:all .35s var(--ease)}
.vote-meter i.on{background:var(--electric);border-color:var(--electric);
  box-shadow:0 0 16px rgba(0,229,199,.65);transform:scale(1.12)}
.vote-btn[disabled]{opacity:.35;filter:saturate(.45)}
.vote-btn[disabled]:active{transform:none}

@keyframes flash{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}

@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}

.settled .w,.settled .kicker,.settled .qsub,.settled .cta,.settled .reveal-title,

    Object.keys(state).forEach(k=>{ if(d[k] !== undefined) state[k] = d[k]; });
  }catch(e){}
}

/* ----- צליל (WebAudio, בלי קבצים) ----- */
let actx = null;
function tone(freq, dur, type){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.28, actx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .05);
  }catch(e){}
}
function taDa(){ tone(523,.16); setTimeout(()=>tone(659,.16),120); setTimeout(()=>tone(880,.5),240); }
function buzz(){ tone(180,.5,'sawtooth'); }
function tick(){ tone(1200,.05,'square'); }

/* ----- קונפטי ----- */
const cvs = document.getElementById('confetti'), cx = cvs.getContext('2d');
let bits = [], rafId = null, endless = false;
const CCOLORS = ['#FFC93C','#FF2E7E','#FF8A1F','#00E5C7','#F4E9D8','#7B4BFF'];
function sizeCanvas(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cvs.width = innerWidth*dpr; cvs.height = innerHeight*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
function spawn(n){
  for(let i=0;i<n;i++){
    bits.push({
      x: Math.random()*innerWidth,
      y: -20 - Math.random()*innerHeight*0.45,
      w: 6+Math.random()*10, h: 8+Math.random()*14,
      vx: (Math.random()-.5)*2.6, vy: 2.4+Math.random()*4.2,
      rot: Math.random()*Math.PI, vr: (Math.random()-.5)*.32,
      c: CCOLORS[(Math.random()*CCOLORS.length)|0]
    });
  }
}
function confettiLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  if(endless && bits.length < 110) spawn(2);
  for(let i=bits.length-1;i>=0;i--){
    const b = bits[i];
    b.x += b.vx; b.y += b.vy; b.vy += 0.035; b.rot += b.vr;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot); cx.fillStyle = b.c;
    cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
    if(b.y > innerHeight+40) bits.splice(i,1);
  }
  if(bits.length || endless) rafId = requestAnimationFrame(confettiLoop);
  else { rafId = null; cx.clearRect(0,0,innerWidth,innerHeight); }
}
function confetti(amount, forever){
  endless = !!forever;
  spawn(REDUCED ? Math.min(amount,40) : amount);
  if(!rafId) rafId = requestAnimationFrame(confettiLoop);
}
function stopConfetti(){ endless = false; }

/* ======================= התשובות מהטפסים של ההורים ======================= */
function findQ(id){ for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].id===id) return QUESTIONS[i]; return null; }

function applyAnswers(a){
  if(!a) return;
  var dad = a.dad || {}, mom = a.mom || {};

  Object.keys(ANSWER_MAP).forEach(function(k){
    var qu = findQ(ANSWER_MAP[k]);
    if(!qu || !qu.reveal) return;
    if(dad[k]) qu.reveal.dad = dad[k];
    if(mom[k]) qu.reveal.mom = mom[k];
  });

  /* שאלה 6 — הכרטיס הנעול. התשובות מהטופס נכנסות לכספת וננעלות מיד. */
  if(dad.q8 || mom.q8){
    if(dad.q8) state.inputs['6_dad'] = dad.q8;
    if(mom.q8) state.inputs['6_mom'] = mom.q8;
    if(!state.unlocked[6]) state.locked[6] = true;
  }

  /* שאלה 4 — מכונת המזל. הפער בין שני המספרים הוא הבדיחה. */
  var q4 = findQ(4);
  if(q4 && q4.slot && (dad.q4 || mom.q4)){
    var d = String(dad.q4 || '').trim(), m = String(mom.q4 || '').trim();
    if(d && m && d !== m){
      q4.slot.answer = d + ' או ' + m + '?';
      q4.reveal.text = 'חיים אמר ' + d + ' חודשים. עינת אמרה ' + m + '. ' +
        'שלושים שנה יחד, ועדיין אין הסכמה על כמה זמן זה לקח לו להחליט.';
    } else if(d && m){
      q4.slot.answer = d + ' חודשים';
      q4.reveal.text = 'שניכם אמרתם ' + d + '. מדאיג כמה אתם מתואמים.';
    } else if(d){
      q4.slot.answer = d + ' חודשים';
      q4.reveal.text = 'זאת הגרסה של חיים. עינת — עכשיו תורך, בקול רם. כמה זמן זה באמת לקח לו?';
    } else {
      q4.slot.answer = m + ' חודשים';
      q4.reveal.text = 'זאת הגרסה של עינת. חיים — עכשיו תורך, בקול רם. כמה זמן זה באמת לקח לך?';
    }
  }
}

function answersReady(){
  var a = state.answers;
  return !!(a && a.dad && a.dad.q1 && a.mom && a.mom.q1);
}

function fetchAnswers(cb){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_') === 0){ if(cb) cb(false, 'לא הוגדרה כתובת גיליון'); return; }
  var done = false;
  var timer = setTimeout(function(){ if(!done){ done = true; if(cb) cb(false, 'הרשת לא ענתה'); } }, 12000);
  fetch(SCRIPT_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(done) return;
      done = true; clearTimeout(timer);
      if(res && res.ok && res.answers){
        state.answers = res.answers; state.answersAt = Date.now();
        applyAnswers(state.answers); save();
        if(cb) cb(true);
      } else if(cb) cb(false, 'הגיליון ענה, אבל בלי תשובות');
    })
    .catch(function(){
      if(done) return;
      done = true; clearTimeout(timer);
      if(cb) cb(false, 'לא הצלחתי להתחבר לגיליון');
    });
}

/* ============================ מנוע השלבים ============================ */
function q(){ return QUESTIONS[state.qi]; }

function buildStages(qu){
  const s = [{type:'ask'}];
  const r = qu.reveal || {};
  const imgInTimer = !!(qu.timer && qu.image);
  if(qu.timer){ (qu.timerRounds || [null]).forEach((label,i)=> s.push({type:'countdown', round:i, label})); }
  if(qu.votes && qu.votes.length){
    qu.votes.forEach((v,i)=> s.push({type:'vote', round:i}));
    if(qu.scoreboard) s.push({type:'scoreboard'});
  }
  if(qu.revealType === 'slot' && qu.slot) s.push({type:'slot'});
  if(qu.quiz && qu.quiz.length){
    qu.quiz.forEach(function(item,i){
      s.push({type:'quizAsk', round:i});
      s.push({type:'quizAns', round:i});
    });
  }
  if(qu.locked) s.push({type:'unlock'});
  if(qu.locked || r.dad || r.mom) s.push({type:'dual'});
  if(r.text) s.push({type:'single'});
  if(qu.image && !imgInTimer) s.push({type:'photo'});
  if(qu.images && qu.images.length) s.push({type:'wall'});
  return s;
}

const CTA_LABEL = {
  countdown: 'להתחיל לספור',
  vote: 'לפתוח את ההצבעה',
  scoreboard: 'ללוח התוצאות',
  slot: 'לסובב את הגלגל',
  unlock: 'לפתוח את הכספת',
  dual: 'לחשוף את האמת',
  single: 'לחשוף את האמת',
  photo: 'להראות את ההוכחה',
  wall: 'להראות את התמונות',
  quizAsk: 'לתמונה הבאה',
  quizAns: 'לגלות'
};

function voteKey(qid, round){ return qid + '_' + round; }
function getVotes(qu, round){
  const k = voteKey(qu.id, round);
  if(!state.votes[k]) state.votes[k] = (qu.votes[round].seed || []).slice();
  const need = qu.votes[round].options.length;
  while(state.votes[k].length < need) state.votes[k].push(0);
  return state.votes[k];
}

/* ניקוד מצטבר: כל סבב הצבעה שבו מתמודדים חיים מול עינת */
function tallyWins(list){
  let dad = 0, mom = 0;
  list.forEach(qu=>{
    (qu.votes||[]).forEach((v,i)=>{
      const di = v.options.findIndex(o=>o.label === DAD);
      const mi = v.options.findIndex(o=>o.label === MOM);
      if(di < 0 || mi < 0) return;
      if(!state.closed[voteKey(qu.id,i)]) return;
      const c = getVotes(qu,i);
      if(c[di] > c[mi]) dad++; else if(c[mi] > c[di]) mom++;
    });
  });
  return {dad, mom};
}

function polaroidHTML(src, cap, style){
  return '<div class="polaroid"' + (style ? ' style="'+style+'"' : '') + '>' +

function wireImages(root){
  root.querySelectorAll('img[data-file]').forEach(img=>{
    const fail = ()=>{
      if(!img.parentNode) return;
      const d = document.createElement('div');
      d.className = 'missing';
      d.innerHTML = '<b>כאן תיכנס התמונה</b><span>' + esc(img.getAttribute('data-file')) + '</span>' +
                    '<span>שימו את הקובץ בתיקיית assets</span>';
      img.replaceWith(d);
    };
    /* מסגרת הפולרואיד מתהדקת סביב התמונה, גם כשהיא לאורך */
    const hug = ()=>{
      if(!img.closest('.photo-wrap, .timer-photo')) return;
      const pol = img.closest('.polaroid');
      if(pol && img.clientWidth > 40) pol.style.width = img.clientWidth + 'px';
    };
    img.addEventListener('load', ()=> setTimeout(hug, 40));
    img.addEventListener('error', fail);
    if(img.complete){
      if(img.naturalWidth === 0) fail(); else setTimeout(hug, 40);
    }
  });
}
function splitWords(text){
  return String(text).split(' ').map((w,i)=>

function renderQuestion(){
  const qu = q();
  const stages = buildStages(qu);
  if(state.stage >= stages.length) state.stage = stages.length - 1;
  if(state.stage < 0) state.stage = 0;
  const st = stages[state.stage];
  state.seen[qu.id] = true;

  const nextSt = stages[state.stage + 1];
  const isLastQ = state.qi === QUESTIONS.length - 1;
  let ctaLabel = nextSt ? (CTA_LABEL[nextSt.type] || 'הלאה')
                        : (isLastQ ? 'למסך הסיום' : 'לשאלה הבאה');
  if(st.type === 'quizAsk') ctaLabel = 'לגלות';
  let ctaClass = 'cta';
  if(st.type === 'vote' && !state.closed[voteKey(qu.id, st.round)]){
    ctaLabel = 'לסגור את ההצבעה'; ctaClass = 'cta teal';
  } else if(!nextSt){ ctaClass = 'cta gold'; }

  app.innerHTML =
  '<div class="screen">' +

      '<div class="act">מערכה ' + ['','א׳','ב׳','ג׳'][qu.act] + '</div>' +

      stageHTML(qu, st, stages) +
    '</div>' +

      '<button class="ghost tiny" id="prevBtn">→ אחורה</button>' +
      '<button class="' + ctaClass + '" id="mainBtn">' + esc(ctaLabel) + '</button>' +
      '<button class="ghost tiny" id="skipBtn">קדימה ←</button>' +
    '</div>' +

  wireImages(app);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('skipBtn').addEventListener('click', next);

    if(st.type === 'vote' && !state.closed[voteKey(qu.id, st.round)]){ closeVote(qu, st.round); return; }

  });
  app.querySelectorAll('[data-jump]').forEach(d=>{
    d.addEventListener('click', ()=>{ state.qi = +d.dataset.jump; state.stage = 0; save(); render(); });
  });

  afterStage(qu, st, stages);

  '</div>';

/* ======================= התנהגות אחרי ציור השלב ======================= */
let tHandle = null, sHandle = null;
function clearTimers(){
  if(tHandle){ clearInterval(tHandle); tHandle = null; }
  if(sHandle){ clearInterval(sHandle); sHandle = null; }
  if(gHandle){ clearInterval(gHandle); gHandle = null; }
}

function afterStage(qu, st, stages){
  const isLast = state.stage === stages.length - 1;

  if(['dual','single','photo','scoreboard','quizAns'].includes(st.type)) flash();

  /* --- כרטיסים כפולים: נכנסים אחד אחרי השני --- */
  if(st.type === 'dual'){
    app.querySelectorAll('.card').forEach(c=>{
      const d = +c.dataset.delay || 0;
      setTimeout(()=>{ c.classList.add('in'); tone(d ? 660 : 520, .18); }, REDUCED ? 0 : d);
    });
  }

  /* --- קיר תמונות: נכנסים אחד אחרי השני --- */
  if(st.type === 'wall'){
    app.querySelectorAll('.wall .polaroid').forEach((c,i)=>{
      setTimeout(()=>{ c.classList.add('in'); tone(520 + i*90, .14); }, REDUCED ? 0 : 120 + i*420);
    });
  }

  /* --- הכספת במסך השאלה --- */
  const lockBtn = document.getElementById('lockSafe');
  if(lockBtn){
    lockBtn.addEventListener('click', ()=>{
      state.inputs[qu.id+'_dad'] = document.getElementById('in_dad').value.trim();
      state.inputs[qu.id+'_mom'] = document.getElementById('in_mom').value.trim();
      state.locked[qu.id] = true; state.unlocked[qu.id] = false;
      tone(240,.3); save(); render();
    });
  }
  const reopen = document.getElementById('reopenSafe');
  if(reopen) reopen.addEventListener('click', ()=>{ state.locked[qu.id] = false; save(); render(); });

  /* --- פתיחת הכספת --- */
  const doUnlock = document.getElementById('doUnlock');
  if(doUnlock){
    if(state.unlocked[qu.id]){
      document.getElementById('lockIco').textContent = '🔓';
      document.getElementById('lockTxt').textContent = 'פתוח. אפשר להמשיך.';
    }
    doUnlock.addEventListener('click', ()=>{
      state.unlocked[qu.id] = true; save();
      document.getElementById('lockIco').textContent = '🔓';
      document.getElementById('lockIco').classList.remove('open'); void document.getElementById('lockIco').offsetWidth;
      document.getElementById('lockIco').classList.add('open');
      document.getElementById('lockTxt').textContent = 'פתוח. אפשר להמשיך.';
      flash(); taDa(); confetti(60);
    });
  }

  /* --- טיימר --- */
  if(st.type === 'countdown'){
    const total = qu.timer, ring = document.getElementById('ring');
    const fg = document.getElementById('ringFg'), num = document.getElementById('ringNum');
    const C = 2 * Math.PI * 52;
    fg.style.strokeDasharray = C; fg.style.strokeDashoffset = 0;
    let left = total, running = false;
    const btn = document.getElementById('startTimer');
    const paint = ()=>{
      num.textContent = left;
      fg.style.strokeDashoffset = C * (1 - left/total);
      ring.classList.toggle('warn', left <= Math.max(3, total*0.2));
    };
    const stop = ()=>{ clearInterval(tHandle); tHandle = null; running = false; };
    const run = ()=>{
      if(running) return;
      running = true; btn.textContent = 'עצור';
      tHandle = setInterval(()=>{
        left--; paint();
        if(left <= 5 && left > 0) tick();
        if(left <= 0){
          stop(); buzz(); flash();
          ring.classList.add('shake');
          num.innerHTML = '<span class="done-badge">נגמר!</span>';
          btn.textContent = 'עוד פעם';
          if(qu.confetti) confetti(150);
        }
      }, 1000);
    };
    btn.addEventListener('click', ()=>{
      if(running){ stop(); btn.textContent = 'להמשיך'; return; }
      if(left <= 0){ left = total; ring.classList.remove('shake'); paint(); }
      run();
    });
    paint();
  }

  /* --- הצבעה --- */
  if(st.type === 'vote'){
    const k = voteKey(qu.id, st.round);
    if(!state.closed[k]){
      app.querySelectorAll('[data-vote]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const i = +b.dataset.vote;
          const c = getVotes(qu, st.round);
          if(c.reduce((a,n)=>a+n,0) >= VOTERS.length){ buzz(); return; }
          c[i]++;
          (state.history[k] = state.history[k] || []).push(i);
          b.querySelector('.tally').textContent = c[i];
          b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
          tone(440 + i*110, .1); save();
          const done = c.reduce((a,n)=>a+n,0);
          const meter = app.querySelectorAll('.vote-meter i');
          meter.forEach((d,j)=> d.classList.toggle('on', j < done));
          const line = app.querySelector('.vote-count');
          const left = Math.max(0, VOTERS.length - done);
          if(line){
            line.textContent = left === 0 ? 'כולם הצביעו. אפשר לסגור.'
                             : left === 1 ? 'נותר קול אחד' : 'נותרו ' + left + ' קולות';
            line.classList.toggle('full', left === 0);
          }
          if(left === 0){
            app.querySelectorAll('[data-vote]').forEach(x=> x.disabled = true);
            tone(660,.14); setTimeout(()=>tone(880,.3),130);
          }
        });
      });
      const u = document.getElementById('undoVote');
      if(u) u.addEventListener('click', ()=>{
        const h = state.history[k] || [];
        if(!h.length) { buzz(); return; }
        const i = h.pop(); const c = getVotes(qu, st.round);
        if(c[i] > 0) c[i]--;
        tone(300,.12); save(); render();
      });
      const cl = document.getElementById('clearVote');
      if(cl) cl.addEventListener('click', ()=>{
        state.votes[k] = (qu.votes[st.round].seed || []).slice();
        state.history[k] = []; tone(220,.2); save(); render();
      });
    } else {
      app.querySelectorAll('.bar-fill').forEach((f,i)=>{
        setTimeout(()=>{ f.style.width = f.dataset.w + '%'; }, REDUCED ? 20 : 140 + i*140);
      });
      const ro = document.getElementById('reopenVote');
      if(ro) ro.addEventListener('click', ()=>{ state.closed[k] = false; save(); render(); });
    }
  }

  /* --- מכונת מזל --- */
  if(st.type === 'slot'){
    const val = document.getElementById('slotVal'), cap = document.getElementById('slotCap');
    const opts = qu.slot.spins.slice(), answer = qu.slot.answer;
    if(REDUCED){ val.textContent = answer; val.classList.add('landed'); cap.textContent = 'התשובה'; taDa(); }
    else {
      let i = 0, delay = 55, elapsed = 0;
      cap.textContent = 'מסתובב…';
      const spin = ()=>{
        val.textContent = opts[i++ % opts.length];
        tick(); elapsed += delay;
        if(elapsed > 2600){ delay += 42; }
        if(delay > 340){
          val.textContent = answer; val.classList.add('landed');
          cap.textContent = 'זאת התשובה שהם עצמם נתנו';
          flash(); taDa(); confetti(70);
          return;
        }
        sHandle = setTimeout(spin, delay);
      };
      sHandle = setTimeout(spin, 500);
    }
  }

  /* --- קונפטי בסוף שאלה מסומנת --- */
  if(isLast && qu.confetti && st.type !== 'countdown'){ confetti(200); taDa(); }
}

/* תמונות שלא נמצאו — נבדק פעם אחת בטעינה כדי שמסך הסיום יישאר נקי */
const MISSING = {};
function probePictures(){
  allPictures(true).forEach(pic=>{
    const im = new Image();
    im.onerror = ()=>{ MISSING[pic.src] = true; };
    im.src = pic.src;
  });
}

/* אוסף כל התמונות של הערב, בלי כפילויות */
function allPictures(includeMissing){
  const seen = {}, out = [];
  const add = (src, cap)=>{
    if(!src || seen[src]) return;
    if(!includeMissing && MISSING[src]) return;
    seen[src] = 1; out.push({src, cap: cap || ''});
  };
  add(INTRO.photoLeft.src, INTRO.photoLeft.cap);
  add(INTRO.photoRight.src, INTRO.photoRight.cap);
  QUESTIONS.forEach(qu=>{
    add(qu.image, qu.imageCaption);
    (qu.votes||[]).forEach(v=> add(v.image, v.imageCaption));
    (qu.images||[]).forEach(im=> add(im.src, im.cap));
    (qu.quiz||[]).forEach(function(it){ add(it.src, it.cap); add(it.answerSrc, it.answerCap); });
  });
  return out;
}

/* מסך הסיום מחליף תמונות בסבב, כדי שכולן יעברו על המסך */
let gHandle = null;
function rotateGallery(pics, slotCount){
  if(REDUCED || pics.length <= slotCount) return;
  let cursor = slotCount;
  gHandle = setInterval(()=>{
    const slots = app.querySelectorAll('.gallery .polaroid');
    if(!slots.length){ clearInterval(gHandle); gHandle = null; return; }
    const slot = slots[(Math.random()*slots.length)|0];
    const pic = pics[cursor % pics.length]; cursor++;
    slot.style.transition = 'opacity .45s ease';
    slot.style.opacity = '0';
    setTimeout(()=>{
      slot.innerHTML = '<img src="' + esc(pic.src) + '" alt="" data-file="' + esc(pic.src) + '">' +
                       '<div class="cap">' + esc(pic.cap || ' ') + '</div>';
      wireImages(slot);
      slot.style.opacity = '1';
    }, 460);
  }, 2600);
}

  wireImages(app);

/* ============================== ניווט ============================== */
function render(){
  clearTimers();
  if(state.screen === 'intro'){ stopConfetti(); renderIntro(); }
  else if(state.screen === 'finale'){ renderFinale(); }
  else { stopConfetti(); renderQuestion(); }
  renderRehearse();
  setTimeout(()=>{ const sc = app.querySelector('.screen'); if(sc) sc.classList.add('settled'); }, REDUCED ? 30 : 2200);
  save();
}

function next(){
  if(state.screen === 'intro'){ state.screen = 'question'; state.qi = 0; state.stage = 0; save(); render(); return; }
  if(state.screen === 'finale') return;
  const stages = buildStages(q());
  if(state.stage < stages.length - 1) state.stage++;
  else if(state.qi < QUESTIONS.length - 1){ state.qi++; state.stage = 0; }
  else { state.screen = 'finale'; }
  save(); render();
}

function prev(){
  if(state.screen === 'intro') return;
  if(state.screen === 'finale'){
    stopConfetti();
    state.screen = 'question'; state.qi = QUESTIONS.length - 1;
    state.stage = buildStages(QUESTIONS[state.qi]).length - 1;
    save(); render(); return;
  }
  if(state.stage > 0) state.stage--;
  else if(state.qi > 0){ state.qi--; state.stage = 0; }
  else { state.screen = 'intro'; }
  save(); render();
}

function closeVote(qu, round){
  state.closed[voteKey(qu.id, round)] = true;
  save(); flash(); tone(392,.25); render();
}

/* מקלדת — לחזרות בבית */
addEventListener('keydown', e=>{
  if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  const k = e.key;
  if(k === ' ' || k === 'Enter' || k === 'ArrowLeft' || k === 'ArrowDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowRight' || k === 'ArrowUp'){ e.preventDefault(); prev(); }
  else if(k === 'r' || k === 'R' || k === 'ר'){ e.preventDefault(); next(); }
});

/* החלקה */
let tx = 0, ty = 0, tt = 0;
app.addEventListener('touchstart', e=>{
  if(e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
}, {passive:true});
app.addEventListener('touchend', e=>{
  if(!tt) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty, dt = Date.now() - tt;
  tt = 0;
  if(dt > 700 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
  if(e.target.closest('button, input')) return;
  if(dx < 0) next(); else prev();
}, {passive:true});

var consoleWho = 'dad';
var consoleEl = document.getElementById('console');

function consoleStatus(){
  var el = document.getElementById('cStatus');
  el.className = 'status';
  if(!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_') === 0){
    el.textContent = 'לא מחובר לגיליון — אפשר להקליד ידנית'; return;
  }
  if(answersReady()){
    el.classList.add('ok');
    el.textContent = 'שתי התשובות הגיעו' + (state.answersAt ? ' · ' + new Date(state.answersAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '');
  } else if(state.answers && (state.answers.dad || state.answers.mom)){
    el.classList.add('bad');
    el.textContent = 'הגיע רק ' + (state.answers.dad && state.answers.dad.q1 ? 'חיים' : 'עינת');
  } else {
    el.classList.add('bad');
    el.textContent = 'עוד לא הגיעו תשובות';
  }
}

function drawConsole(){
  var body = document.getElementById('cBody');
  var a = state.answers || {};
  var mine = a[consoleWho] || {};
  body.innerHTML = Object.keys(ANSWER_LABELS).map(function(k){
    return '<div class="cfield"><label>' + esc(ANSWER_LABELS[k]) + '</label>' +
      '<textarea data-k="' + k + '" rows="2">' + esc(mine[k] || '') + '</textarea></div>';
  }).join('');
  consoleEl.querySelectorAll('.who-tabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.who === consoleWho);
  });
  consoleStatus();
}

function openConsole(){
  consoleEl.classList.add('on');
  drawConsole();
}
function closeConsole(){ consoleEl.classList.remove('on'); }

function collectConsole(){
  var a = state.answers || {dad:null, mom:null};
  var mine = {};
  consoleEl.querySelectorAll('[data-k]').forEach(function(t){
    var v = String(t.value || '').trim();
    if(v) mine[t.dataset.k] = v;
  });
  if(Object.keys(mine).length){
    a[consoleWho] = Object.assign({}, a[consoleWho] || {}, mine);
  }
  state.answers = a;
}

consoleEl.querySelectorAll('.who-tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    collectConsole();
    consoleWho = b.dataset.who;
    drawConsole();
  });
});
document.getElementById('cClose').addEventListener('click', closeConsole);
document.getElementById('cSave').addEventListener('click', function(){

  save(); consoleStatus(); tone(660,.2);
  closeConsole(); render();
});
document.getElementById('cPull').addEventListener('click', function(){

  });
});

/* לחיצה ארוכה על "בשידור חי" פותחת את מסך התשובות */
(function(){
  var badge = document.querySelector('.onair'), h = null;
  badge.style.pointerEvents = 'auto';
  var start = function(){ h = setTimeout(openConsole, 1100); };
  var cancel = function(){ if(h){ clearTimeout(h); h = null; } };
  ['mousedown','touchstart'].forEach(function(e){ badge.addEventListener(e, start, {passive:true}); });
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(e){ badge.addEventListener(e, cancel, {passive:true}); });
})();

/* ============================ מצב חזרות ============================ */
function renderRehearse(){
  if(!REHEARSE) return;
  let box = document.getElementById('rehearseBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'rehearseBox'; box.className = 'rehearse';
    document.body.appendChild(box);
  }
  const stages = state.screen === 'question' ? buildStages(q()) : [];
  box.innerHTML = '<h5>מצב חזרות</h5><div class="grid">' +
    QUESTIONS.map((qu,i)=> '<button data-go="' + i + '" class="' + (state.screen==='question' && i===state.qi ? 'on' : '') + '">' + qu.id + '</button>').join('') +
    '</div>' +
    '<button class="wide" data-scr="intro">מסך פתיחה</button>' +
    '<button class="wide" data-scr="finale">מסך סיום</button>' +
    '<button class="wide" id="rhAnswers">תשובות ההורים</button>' +
    (stages.length ? '<button class="wide">שלב ' + (state.stage+1) + ' מתוך ' + stages.length + ' · ' + stages[state.stage].type + '</button>' : '');
  box.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=>{
    state.screen = 'question'; state.qi = +b.dataset.go; state.stage = 0; save(); render();
  }));
  box.querySelectorAll('[data-scr]').forEach(b=> b.addEventListener('click', ()=>{
    stopConfetti(); state.screen = b.dataset.scr; save(); render();
  }));
  var ra = box.querySelector('#rhAnswers');
  if(ra) ra.addEventListener('click', openConsole);
}

/* ============================== הפעלה ============================== */
load();
applyAnswers(state.answers);
probePictures();
render();
fetchAnswers(function(ok){ if(ok) render(); });
['pointerdown','keydown','touchstart'].forEach(ev=>
  addEventListener(ev, function once(){
    keepAwake();
    try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){}
    ['pointerdown','keydown','touchstart'].forEach(e2=> removeEventListener(e2, once));
  }, {once:false})
);
document.getElementById('rotateSkip').addEventListener('click', ()=>
  document.getElementById('rotateHint').classList.add('off'));
addEventListener('gesturestart', e=> e.preventDefault());
addEventListener('resize', ()=> sizeCanvas());
</script>
